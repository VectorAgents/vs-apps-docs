name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # The site address on Cloudflare, with no trailing slash. The build fails while the variable is unset.
      DOCS_URL: ${{ vars.DOCS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The package is restricted on GitHub Packages; the secret must grant read:packages.
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_TOKEN }}" >> .npmrc
      - run: pnpm install --frozen-lockfile
      # Writes static/verified.json, then builds the site.
      - run: pnpm build
      # Includes the Basic auth check, so a build that serves a page without a login is not deployed.
      - run: pnpm test:build
      # The token needs the Workers Scripts edit permission. The Basic auth secrets live on the Worker, not here.
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
